services:
  # PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: connectme-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-connectme_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-connectme_secure_pass}
      - POSTGRES_DB=${POSTGRES_DB:-connectme_db}
    volumes:
      - connectme-postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-connectme_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - connectme-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: connectme-redis
    command: redis-server --appendonly yes
    volumes:
      - connectme-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - connectme-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: connectme-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - connectme-network

  # MinIO (S3 Storage)
  minio:
    image: minio/minio:latest
    container_name: connectme-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - connectme-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - connectme-network

networks:
  connectme-network:
    driver: bridge

volumes:
  connectme-postgres-data:
  connectme-redis-data:
  connectme-minio-data:
