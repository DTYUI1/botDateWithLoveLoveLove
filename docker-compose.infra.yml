services:
  # PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: connectme-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER не задан в .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB не задан в .env}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --locale=ru_RU.UTF-8
    volumes:
      - connectme-postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    ports:
      - "5432:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - connectme-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: connectme-redis
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - connectme-redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - connectme-network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: connectme-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:?RABBITMQ_USER не задан в .env}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD не задан в .env}
    volumes:
      - connectme-rabbitmq-data:/var/lib/rabbitmq
      - ./infrastructure/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - connectme-network

  # MinIO (S3 Storage)
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: connectme-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY не задан в .env}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY не задан в .env}
    volumes:
      - connectme-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - connectme-network

networks:
  connectme-network:
    driver: bridge

volumes:
  connectme-postgres-data:
  connectme-redis-data:
  connectme-rabbitmq-data:
  connectme-minio-data:
