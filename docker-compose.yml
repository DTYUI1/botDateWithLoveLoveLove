services:
  # Telegram Bot
  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Прокси через host.docker.internal (127.0.0.1 хоста недоступен из контейнера)
      - HTTPS_PROXY=http://host.docker.internal:7897
      - HTTP_PROXY=http://host.docker.internal:7897
      - NO_PROXY=db,redis,backend,minio,rabbitmq,localhost,127.0.0.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - connectme-network
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:?POSTGRES_USER не задан в .env}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}@db:5432/${POSTGRES_DB:?POSTGRES_DB не задан в .env}
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:?RABBITMQ_USER не задан в .env}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD не задан в .env}@rabbitmq:5672//
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:?MINIO_ACCESS_KEY не задан в .env}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:?MINIO_SECRET_KEY не задан в .env}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - connectme-network
    restart: unless-stopped
    ports:
      - "8005:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # PostgreSQL
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER не задан в .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в .env}
      - POSTGRES_DB=${POSTGRES_DB:?POSTGRES_DB не задан в .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - connectme-network
    restart: unless-stopped
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - connectme-network
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  connectme-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
