# RabbitMQ конфигурация для ConnectMe
# Оптимизировано для очереди сообщений

# ============================================
# УПРАВЛЕНИЕ
# ============================================
# Exchanges и queues создаются через event_publisher.py при запуске backend

# ============================================
# ПРОИЗВОДИТЕЛЬНОСТЬ
# ============================================
vm_memory_high_watermark.relative = 0.6
disk_free_limit.absolute = 1GB

# ============================================
# КЛАСТЕРИЗАЦИЯ
# ============================================
queue_master_locator = min-masters

# ============================================
# ЛОГИРОВАНИЕ
# ============================================
log.file = rabbit.log
log.file.level = info
log.console = false
log.console.level = info

# ============================================
# ТАЙМАУТЫ
# ============================================
heartbeat = 60
frame_max = 131072
channel_max = 2047

# ============================================
# ПОРТЫ
# ============================================
listeners.tcp.default = 5672
management.tcp.port = 15672
