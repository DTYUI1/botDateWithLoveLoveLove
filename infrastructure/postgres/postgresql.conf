# PostgreSQL конфигурация для ConnectMe
# Оптимизировано для SSD и средней нагрузки

# ============================================
# СЕТЬ
# ============================================
# Без явного listen_addresses postgres слушает только loopback,
# и backend из другого контейнера не достучится по TCP.
listen_addresses = '*'

# ============================================
# ПАМЯТЬ
# ============================================
shared_buffers = 256MB
effective_cache_size = 1GB
maintenance_work_mem = 64MB
work_mem = 16MB
temp_buffers = 32MB

# ============================================
# WAL (Write-Ahead Logging)
# ============================================
wal_buffers = 16MB
max_wal_size = 1GB
min_wal_size = 80MB
wal_level = replica
max_wal_senders = 3

# ============================================
# CHECKPOINTS
# ============================================
checkpoint_completion_target = 0.9
checkpoint_timeout = 5min

# ============================================
# ПЛАНИРОВЩИК ЗАПРОСОВ
# ============================================
random_page_cost = 1.1  # SSD оптимизация
effective_io_concurrency = 200
default_statistics_target = 100

# ============================================
# АВТОВАКУУМ
# ============================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 60s
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05

# ============================================
# ЛОГИРОВАНИЕ
# ============================================
logging_collector = on
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d.log'
log_statement = 'mod'  # Логировать INSERT, UPDATE, DELETE
log_min_duration_statement = 1000  # Логировать медленные запросы (>1s)
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on

# ============================================
# ПОДКЛЮЧЕНИЯ
# ============================================
max_connections = 100
superuser_reserved_connections = 3

# ============================================
# SSL (опционально, можно включить позже)
# ============================================
# ssl = on
# ssl_cert_file = '/etc/ssl/certs/ssl-cert-snakeoil.pem'
# ssl_key_file = '/etc/ssl/private/ssl-cert-snakeoil.key'
