# Redis конфигурация для ConnectMe
# Оптимизировано для кэширования анкет и FSM состояний

# ============================================
# MEMORY
# ============================================
maxmemory 512mb
maxmemory-policy allkeys-lru

# ============================================
# ПЕРСИСТЕНТНОСТЬ (RDB Snapshots)
# ============================================
save 900 1
save 300 10
save 60 10000

dbfilename dump.rdb
dir ./

# ============================================
# AOF (Append Only File)
# ============================================
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================================
# ПРОИЗВОДИТЕЛЬНОСТЬ
# ============================================
timeout 300
tcp-keepalive 60
tcp-backlog 511

# ============================================
# ОБЩИЕ НАСТРОЙКИ
# ============================================
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile ""
databases 16

# ============================================
# БЕЗОПАСНОСТЬ
# ============================================
# requirepass your_secure_password_here  # Раскомментировать для продакшена
# rename-command FLUSHDB ""  # Отключить опасные команды
# rename-command FLUSHALL ""
# rename-command DEBUG ""

# ============================================
# ЛАЙВНЕС
# ============================================
hz 10
dynamic-hz yes
