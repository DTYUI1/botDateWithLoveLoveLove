services:
  mysql:
    image: mysql:8.4
    container_name: isolation-anomalies-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: isolation_lab
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
