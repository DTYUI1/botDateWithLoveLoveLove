name: CI

on:
  push:
    branches: [main, develop, "stage*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install --no-cache-dir "ruff>=0.5,<0.6"
      - name: Ruff check
        run: ruff check backend bot tests

  tests:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install backend + tests deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r tests/requirements.txt
      - name: Run pytest (без инфраструктуры — infra-кейсы помечены skip)
        env:
          PYTHONPATH: backend
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          REDIS_URL: ""
          RABBITMQ_URL: ""
        run: pytest tests -v --tb=short

  build-images:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate docker compose config
        run: |
          set -euo pipefail
          # На время валидации подсовываем пустые .env, чтобы compose
          # отрабатывал без секретов.
          cp .env.example .env
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
          docker compose -f docker-compose.infra.yml config > /dev/null
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: connectme/backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build bot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: bot/Dockerfile
          push: false
          tags: connectme/bot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true
